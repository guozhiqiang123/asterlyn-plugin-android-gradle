name: Release plugin package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guozhiqiang123/asterlyn
          ref: v0.1.23
          path: host
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Verify tag identity
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run verify
      - run: npm run package:release
      - name: Verify with the isolated host runtime
        run: |
          set -- release/*.asterlyn-plugin.tgz
          test "$#" -eq 1
          ASTERLYN_ANDROID_PLUGIN_PACKAGE="$(realpath "$1")" \
          ASTERLYN_ANDROID_PLUGIN_VERSION="$(node -p "require('./package.json').version")" \
          ASTERLYN_HOST_VERSION="0.1.23" \
          cargo test --manifest-path host/Cargo.toml -p asterlyn-plugin-host --test android_release_parity -- --ignored
      - name: Inspect with the host validator
        env:
          ASTERLYN_HOST_CHECKOUT: ${{ github.workspace }}/host
        run: npm run package:inspect
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-gradle-plugin-package
          path: |
            release/*.asterlyn-plugin.tgz
            release/release-summary.json
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release/*.asterlyn-plugin.tgz
